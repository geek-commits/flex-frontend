# Demo Chat (Social) — Apache fix for FLEX iframe embed
# Host: demo-chat.flex.co.tz (Server: Apache, 41.59.199.53)
# Effective layer: Apache vhost / reverse-proxy
# Apply to vhost that serves https://demo-chat.flex.co.tz

# 1) Remove invalid X-Frame-Options "cc.flex.co.tz" (CSP below is the sole
# frame-embedding authority). Clear both Apache header tables so it cannot be
# re-added on either normal or error responses.
Header unset X-Frame-Options
Header always unset X-Frame-Options

# 2) Replace any inherited CSP in both header tables with the canonical,
# least-privilege parent-origin list. Do not use a wildcard or ALLOW-FROM.
Header unset Content-Security-Policy
Header always unset Content-Security-Policy
Header always set Content-Security-Policy "frame-ancestors 'self' https://cc.flex.co.tz https://devcc.flex.co.tz https://flxcc.flex.co.tz; object-src *"

# Preserve HSTS, X-Content-Type-Options, Referrer-Policy, X-XSS-Protection
# Verify effective source: grep -R "Content-Security-Policy" /etc/apache2
