# Demo Chat (Social) — Apache fix for FLEX iframe embed
# Host: demo-chat.flex.co.tz (Server: Apache, 41.59.199.53)
# Effective layer: Apache vhost / reverse-proxy
# Apply to vhost that serves https://demo-chat.flex.co.tz

# 1) Remove invalid X-Frame-Options value "cc.flex.co.tz" (not DENY/SAMEORIGIN/ALLOW-FROM — browsers treat as DENY or ignore)
Header always unset X-Frame-Options
# Ensure no re-add:
# Header unset X-Frame-Options

# 2) Set canonical CSP frame-ancestors (X-Frame-Options must not be used as origin allowlist; use CSP)
Header always set Content-Security-Policy "frame-ancestors 'self' https://cc.flex.co.tz https://devcc.flex.co.tz https://flxcc.flex.co.tz https://demo-crm.flex.co.tz https://demo-chat.flex.co.tz http://localhost:8000 http://localhost:5173; object-src *"

# Preserve HSTS, X-Content-Type-Options, Referrer-Policy, X-XSS-Protection
# Verify effective source: grep -R "Content-Security-Policy" /etc/apache2

# Note: If production requires strict allowlist without localhost, use:
# Header always set Content-Security-Policy "frame-ancestors 'self' https://cc.flex.co.tz https://devcc.flex.co.tz https://flxcc.flex.co.tz https://demo-crm.flex.co.tz https://demo-chat.flex.co.tz; object-src *"
