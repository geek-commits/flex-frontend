# Demo CRM — Apache fix for FLEX iframe embed
# Host: demo-crm.flex.co.tz (Server: Apache, 41.59.199.53)
# Effective layer: Apache vhost / reverse-proxy (verified via Server header, not Laravel middleware)
# Apply to vhost that serves https://demo-crm.flex.co.tz
# Requires: apache reload (apachectl -t && systemctl reload apache2 / httpd)

# 1) Remove incompatible X-Frame-Options SAMEORIGIN (blocks cc.flex.co.tz and localhost)
Header always unset X-Frame-Options
# Also ensure no other layer re-adds it:
# Header unset X-Frame-Options  (in case set without 'always')

# 2) Set canonical CSP frame-ancestors (do not use wildcard, do not use X-Frame-Options ALLOW-FROM)
# Dev/demo allowlist includes localhost for FLEX dev; production should remove localhost origins.
Header always set Content-Security-Policy "frame-ancestors 'self' https://cc.flex.co.tz https://devcc.flex.co.tz https://flxcc.flex.co.tz https://demo-crm.flex.co.tz https://demo-chat.flex.co.tz http://localhost:8000 http://localhost:5173; object-src *"

# Preserve all unrelated security headers (do not disable):
# Strict-Transport-Security, X-Content-Type-Options, Referrer-Policy, X-XSS-Protection remain as-is
# Ensure no duplicate Header set in .htaccess or CDN panel — fix only the effective source (grep -R "X-Frame-Options" /etc/apache2 /etc/httpd)
